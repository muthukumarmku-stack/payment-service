# Local development database.
#   Start: docker compose up -d
#   Stop:  docker compose down        (add -v to also wipe the data)
services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-service-db
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments   # local-only credential, matches application.yml defaults
    ports:
      - "5432:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  payment-db-data:

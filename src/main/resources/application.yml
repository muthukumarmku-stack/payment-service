spring:
  application:
    name: payment-service

  # Values come from environment variables; the defaults match the local
  # Docker PostgreSQL that step 02 adds.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USERNAME:payments}
    password: ${DB_PASSWORD:payments}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100   # larger ?size= values are capped, so one request can't load the whole table

server:
  port: ${SERVER_PORT:8081}   # 8080 is taken by another process on this machine
  error:
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
